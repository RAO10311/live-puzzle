<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Live Puzzle | Aryan</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header class="top"><div><p class="eyebrow">A LITTLE BRAIN WORKOUT</p><h1>Live <span>Puzzle</span></h1><p class="subtitle">Slide the tiles. Put the numbers in order.</p></div><div class="status"><span class="dot"></span> READY TO PLAY</div></header>
<section class="game-panel"><div class="toolbar"><label for="difficulty">Grid size</label><select id="difficulty"><option value="3">3 × 3</option><option value="4" selected>4 × 4</option><option value="5">5 × 5</option></select><div class="stats"><div><small>MOVES</small><strong id="moves">0</strong></div><div><small>TIME</small><strong id="time">00:00</strong></div></div></div>
<div id="board" class="board" aria-label="Number puzzle board"></div><div class="actions"><button id="shuffle" class="primary">New game</button><button id="reset" class="secondary">Reset</button></div><p id="message" class="message" aria-live="polite">Choose a tile beside the empty space to move it.</p></section>
<footer>Built with HTML, CSS and JavaScript · Your best time stays on this device</footer></main><script src="script.js"></script></body></html>
